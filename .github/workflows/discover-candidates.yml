name: Discover RNA foundation model candidates

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days of recent literature to scan
        required: false
        default: "60"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover candidates
        run: |
          LOOKBACK_DAYS="${{ inputs.lookback_days || '60' }}"
          python scripts/discover_candidates.py --lookback-days "$LOOKBACK_DAYS" --update

      - name: Auto-classify candidates
        run: python scripts/classify_candidates.py --update

      - name: Regenerate README
        run: python generate_paper_list.py

      - name: Validate metadata
        run: python scripts/validate_papers.py

      - name: Create candidate update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/papers.yaml data/candidates.yaml README.md assets/model_timeline.svg 'assets/model_timeline-*.svg')" ]; then
            echo "No model metadata, candidate, README, or timeline changes."
            exit 0
          fi

          UPDATE_BRANCH="bot/update-rna-models"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add data/papers.yaml data/candidates.yaml README.md assets/model_timeline.svg 'assets/model_timeline-*.svg'
          git commit -m "Update RNA foundation model metadata"
          git push --force origin "HEAD:$UPDATE_BRANCH"

          PR_BODY="Automated literature scan found new RNA sequence foundation-model candidates, auto-classified only strict-scope promotable entries into data/papers.yaml, and regenerated README.md plus assets/model_timeline.svg. Please verify the metadata, classification, and strict-scope fit before merging."

          if gh pr view "$UPDATE_BRANCH" --json url --jq .url; then
            gh pr edit "$UPDATE_BRANCH" \
              --title "Update RNA foundation model metadata" \
              --body "$PR_BODY"
            exit 0
          fi

          if gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "Update RNA foundation model metadata" \
            --body "$PR_BODY"; then
            exit 0
          fi

          echo "::warning::Update branch was pushed, but this repository does not allow GitHub Actions to create pull requests. Open a PR manually from $UPDATE_BRANCH or enable 'Allow GitHub Actions to create and approve pull requests' in repository settings."
