name: Validate README metadata

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate metadata
        run: python scripts/validate_papers.py

      - name: Regenerate README
        run: python generate_paper_list.py

      - name: Check generated README and assets are committed
        run: |
          if [ -n "$(git status --porcelain README.md assets/model_timeline.svg 'assets/model_timeline-*.svg')" ]; then
            git status --short README.md assets/model_timeline.svg 'assets/model_timeline-*.svg'
            git diff -- README.md assets/model_timeline.svg 'assets/model_timeline-*.svg'
            exit 1
          fi
